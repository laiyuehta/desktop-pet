[package]
name = "piwifi"
version = "0.1.0"
edition = "2021"
description = "Wi-Fi & rescue hotspot daemon for Raspberry Pi (NetworkManager / nmcli)"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
