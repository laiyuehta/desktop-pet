# gitleaks 設定（CI 的 secrets-scan 會用；本機：gitleaks git --config .gitleaks.toml）
# 1. 沿用 gitleaks 內建規則（token、私鑰、雲端金鑰…）。
# 2. 加上「個人與環境資訊」規則（tag: personal）：DDNS 網域、私有 IP、Windows 使用者路徑。
#    這裡只放通用樣式，不放真正的網址、IP 或 Wi‑Fi 名稱。
#    家裡 Wi‑Fi 名稱、電腦名稱這類無法寫成通用樣式的，用 tools/ci/check_personal.py 比對雜湊，
#    雜湊放在 GitHub Actions secret PERSONAL_HASHES，不進 repo。
#    tools/ci/check_personal.py 也會讀 tag 有 "personal" 的規則，拿來檢查 commit 訊息。

[extend]
useDefault = true

[[rules]]
id = "personal-ddns-domain"
description = "動態 DNS 網域（家用對外網址）"
regex = '''(?i)\b[a-z0-9][a-z0-9-]*\.(?:ddns\.net|duckdns\.org|no-ip\.(?:org|com|biz|info)|noip\.me|hopto\.org|zapto\.org|sytes\.net|servehttp\.com|myftp\.(?:org|biz)|dynu\.(?:net|com)|freeddns\.org|ddnsfree\.com|dyndns\.org|changeip\.com|synology\.me|myds\.me|asuscomm\.com|tplinkdns\.com|dnsalias\.(?:net|org|com))\b'''
tags = ["personal"]

[[rules]]
id = "personal-private-ipv4"
description = "私有或鏈路本地 IPv4（區網位址）；文件請用 192.0.2.x／198.51.100.x／203.0.113.x"
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3})\b'''
tags = ["personal"]
  [[rules.allowlists]]
  description = "NetworkManager 熱點的預設位址（通用，不是個人資訊）"
  regexes = ['''^10\.42\.0\.1$''']

[[rules]]
id = "personal-ipv6-ula"
description = "IPv6 區網位址（ULA fdxx::/8）"
regex = '''(?i)\bfd[0-9a-f]{2}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f:]*'''
tags = ["personal"]

[[rules]]
id = "personal-windows-user-path"
description = "含真實使用者名稱的 Windows 路徑；文件請寫 C:\\Users\\<user>\\"
regex = '''(?i)\b[a-z]:\\{1,2}users\\{1,2}[a-z0-9._-]+'''
tags = ["personal"]
  [[rules.allowlists]]
  regexes = ['''(?i)users\\{1,2}(?:public|default)$''']
