name: CI

# #38：依路徑分流。這個入口 workflow 每次都跑：
#   - changes：用 dorny/paths-filter 判斷改了哪一端
#   - frontend / backend / piwifi：呼叫各自的 workflow（沒改到就 skip）
#   - "tests (Python 3.13)"：彙總（必過 check 名稱不變；被 skip 的子 job 視為通過，失敗／取消才算失敗）
#   - "secrets & personal-info scan"：整個 repo，每次都跑
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.f.outputs.frontend }}
      backend: ${{ steps.f.outputs.backend }}
      piwifi: ${{ steps.f.outputs.piwifi }}
    steps:
      - uses: actions/checkout@v7
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflows: &workflows
              - '.github/workflows/**'
            shared: &shared
              - 'shared/**'
            frontend:
              - 'frontend/**'
              - 'deploy.env.example'
              - '.gitignore'
              - *shared
              - *workflows
            backend:
              - 'backend/**'
              - '.gitignore'
              - *shared
              - *workflows
            piwifi:
              - 'piwifi/**'
              - *workflows

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || (github.event_name != 'pull_request' && github.event_name != 'push') || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/frontend.yml

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || (github.event_name != 'pull_request' && github.event_name != 'push') || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/backend.yml

  piwifi:
    needs: changes
    if: needs.changes.outputs.piwifi == 'true' || (github.event_name != 'pull_request' && github.event_name != 'push') || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/piwifi.yml

  tests:
    name: tests (Python 3.13)
    needs: [changes, frontend, backend, piwifi]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          for k, v in needs.items():
              print(f"{k}: {v['result']}")
          sys.exit(1 if bad else 0)
          PY

  secrets-scan:
    name: secrets & personal-info scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: CI tool tests (tools/ci/tests)
        run: |
          python -m pip install "Pillow==13.0.0"   # 鎖版本； test_check_png_metadata 用 Pillow 產生測試 PNG
          python -m unittest discover -s tools/ci/tests -v
      - name: Install gitleaks (pinned + checksum)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: gitleaks – PR diff
        if: github.event_name == 'pull_request'
        run: |
          /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .
      - name: gitleaks – full history (all refs)
        run: /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="--all" .
      - name: personal-info check (hashes + commit messages)
        env:
          # 加鹽雜湊（家裡 Wi‑Fi 名稱、電腦名稱、正式網址），只存在 Actions secret，不進 repo
          PERSONAL_HASHES: ${{ secrets.PERSONAL_HASHES }}
        run: python tools/ci/check_personal.py --tree --history --rev-range=--all
      - name: PNG metadata check (no prompt/workflow text chunks)
        env:
          DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          if [ -n "$DIFF_RANGE" ]; then
            python tools/ci/check_png_metadata.py --tree --diff "$DIFF_RANGE"
          else
            python tools/ci/check_png_metadata.py --tree
          fi
