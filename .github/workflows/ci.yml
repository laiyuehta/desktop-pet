name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 跟 Pi（Debian 13）與 R7（ComfyUI 內附）的 Python 3.13 一致
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          # tests/test_remote_page.py 用 node 檢查遙控頁的 script
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q

  secrets-scan:
    name: secrets & personal-info scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install gitleaks (pinned + checksum)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: gitleaks – PR diff
        if: github.event_name == 'pull_request'
        run: |
          /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .
      - name: gitleaks – full history (all refs)
        run: /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="--all" .
      - name: personal-info check (hashes + commit messages)
        env:
          # 加鹽雜湊（家裡 Wi‑Fi 名稱、電腦名稱、正式網址），只存在 Actions secret，不進 repo
          PERSONAL_HASHES: ${{ secrets.PERSONAL_HASHES }}
        run: python tools/ci/check_personal.py --tree --history --rev-range=--all
      - name: PNG metadata check (no prompt/workflow text chunks)
        env:
          DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          if [ -n "$DIFF_RANGE" ]; then
            python tools/ci/check_png_metadata.py --tree --diff "$DIFF_RANGE"
          else
            python tools/ci/check_png_metadata.py --tree
          fi

  rust:
    name: rust (piwifi)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/piwifi
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain (stable + musl target)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target aarch64-unknown-linux-musl
          rustup default stable
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      - name: cargo build (aarch64-unknown-linux-musl)
        run: cargo build --release --target aarch64-unknown-linux-musl
